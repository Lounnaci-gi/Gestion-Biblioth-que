<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المكتبة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-[#fff7ed] text-slate-800">
  <div class="min-h-screen bg-[radial-gradient(circle_at_top_left,_rgba(249,115,22,0.18),_transparent_30%),radial-gradient(circle_at_bottom_right,_rgba(251,191,36,0.2),_transparent_30%)]">
    <div class="mx-auto flex min-h-screen w-full max-w-[100rem] flex-col lg:flex-row">
      <aside class="w-full shrink-0 border-b border-orange-200 bg-white/90 p-5 shadow-sm backdrop-blur lg:w-64 lg:border-b-0 lg:border-l lg:pr-6">
        <div class="flex items-center gap-3 rounded-2xl border border-orange-200 bg-orange-50 p-3">
          <span class="text-3xl">📚</span>
          <div>
            <h1 class="text-lg font-semibold text-slate-900">المكتبة</h1>
            <p class="text-sm text-slate-500">منصة إدارة ذكية</p>
          </div>
        </div>
        <nav class="mt-6 space-y-2">
          <button class="nav-btn active w-full rounded-xl px-4 py-3 text-right text-sm font-medium text-slate-700 transition" data-view="dashboard">لوحة التحكم</button>
          <button class="nav-btn w-full rounded-xl px-4 py-3 text-right text-sm font-medium text-slate-600 transition" data-view="livres">الكتب</button>
          <button class="nav-btn w-full rounded-xl px-4 py-3 text-right text-sm font-medium text-slate-600 transition" data-view="emplacements">المواقع</button>
          <button class="nav-btn w-full rounded-xl px-4 py-3 text-right text-sm font-medium text-slate-600 transition" data-view="adherents">الأعضاء</button>
          <button class="nav-btn w-full rounded-xl px-4 py-3 text-right text-sm font-medium text-slate-600 transition" data-view="emprunts">الاستعارات</button>
          <button class="nav-btn w-full rounded-xl px-4 py-3 text-right text-sm font-medium text-slate-600 transition" data-view="settings">المعلومات</button>
        </nav>
        <div class="mt-8 rounded-2xl border border-orange-200 bg-orange-50 p-3 text-sm text-orange-700">
          <span id="db-status" class="flex items-center gap-2">جاري الاتصال…</span>
        </div>
        <div id="settings-summary" class="mt-3 rounded-2xl border border-orange-200 bg-white p-3 text-sm text-slate-600"></div>
      </aside>

      <main class="flex-1 p-4 sm:p-6 lg:p-8">
        <header class="mb-6 flex flex-wrap items-center justify-between gap-3 rounded-3xl border border-orange-200 bg-white/90 p-4 shadow-lg shadow-orange-100/80 backdrop-blur">
          <h2 id="page-title" class="text-2xl font-semibold text-slate-900">لوحة التحكم</h2>
          <button id="btn-add" class="hidden rounded-2xl bg-orange-500 px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-orange-500/20 transition hover:bg-orange-400">+ إضافة</button>
        </header>

        <section id="view-dashboard" class="view active space-y-6">
          <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3" id="stats-grid"></div>
          <div class="rounded-3xl border border-orange-200 bg-white/90 p-4 shadow-lg shadow-orange-100/80 backdrop-blur">
            <h3 class="mb-4 text-lg font-semibold text-slate-900">آخر الاستعارات</h3>
            <div id="recent-emprunts" class="overflow-x-auto"></div>
          </div>
        </section>

        <section id="view-livres" class="view space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3 rounded-3xl border border-orange-200 bg-white/90 p-4 shadow-lg shadow-orange-100/80 backdrop-blur">
            <div class="flex flex-wrap items-center gap-3">
              <label class="text-sm font-medium text-slate-700">تصفية حسب الفئة:</label>
              <select id="livres-category-filter" class="rounded-xl border border-orange-200 bg-orange-50 px-3 py-1.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-orange-500" onchange="filterLivresByCategory(this.value)">
                <option value="">كل الفئات</option>
              </select>
            </div>
            <button type="button" id="btn-print-livres" onclick="printLivresList()" class="inline-flex items-center gap-2 rounded-xl border border-orange-300 bg-white px-4 py-2 text-sm font-semibold text-orange-700 shadow-sm transition hover:bg-orange-50">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 9V4h12v5M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6v-8z" />
              </svg>
              طباعة القائمة
            </button>
          </div>
          <div class="overflow-x-auto rounded-3xl border border-orange-200 bg-white/90 p-4 shadow-lg shadow-orange-100/80 backdrop-blur" id="livres-table"></div>
        </section>

        <section id="view-emplacements" class="view space-y-4">
          <div class="overflow-x-auto rounded-3xl border border-orange-200 bg-white/90 p-4 shadow-lg shadow-orange-100/80 backdrop-blur" id="emplacements-table"></div>
        </section>

        <section id="view-adherents" class="view space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3 rounded-3xl border border-orange-200 bg-white/90 p-4 shadow-lg shadow-orange-100/80 backdrop-blur">
            <div class="flex flex-wrap items-center gap-3">
              <label class="text-sm font-medium text-slate-700">تصفية حسب الحالة:</label>
              <select id="adherents-status-filter" class="rounded-xl border border-orange-200 bg-orange-50 px-3 py-1.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-orange-500" onchange="filterAdherentsByStatus(this.value)">
                <option value="">كل الحالات</option>
                <option value="نشط">نشط</option>
                <option value="غير نشط">غير نشط</option>
                <option value="موقوف">موقوف</option>
              </select>
            </div>
            <button type="button" id="btn-print-adherents" onclick="printAdherentsList()" class="inline-flex items-center gap-2 rounded-xl border border-orange-300 bg-white px-4 py-2 text-sm font-semibold text-orange-700 shadow-sm transition hover:bg-orange-50">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 9V4h12v5M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6v-8z" />
              </svg>
              طباعة القائمة
            </button>
          </div>
          <div class="overflow-x-auto rounded-3xl border border-orange-200 bg-white/90 p-4 shadow-lg shadow-orange-100/80 backdrop-blur" id="adherents-table"></div>
        </section>

        <section id="view-emprunts" class="view">
          <div class="overflow-x-auto rounded-3xl border border-orange-200 bg-white/90 p-4 shadow-lg shadow-orange-100/80 backdrop-blur" id="emprunts-table"></div>
        </section>

        <section id="view-settings" class="view">
          <div class="rounded-3xl border border-orange-200 bg-white/90 p-6 shadow-lg shadow-orange-100/80 backdrop-blur">
            <div class="mb-6 flex items-center justify-between">
              <div>
                <h3 class="text-xl font-semibold text-slate-900">معلومات المؤسسة</h3>
                <p class="mt-1 text-sm text-slate-500">يمكنك modifier le nom du lycée, université ou établissement</p>
              </div>
              <button id="btn-save-settings" class="rounded-2xl bg-orange-500 px-4 py-2 text-sm font-semibold text-white">حفظ التغييرات</button>
            </div>
            <form id="settings-form" class="grid gap-4 md:grid-cols-2">
              <div class="space-y-2">
                <label class="text-sm font-medium text-slate-700">اسم المؤسسة</label>
                <input name="etablissement" class="w-full rounded-2xl border border-orange-200 bg-orange-50 px-3 py-2" />
              </div>
              <div class="space-y-2">
                <label class="text-sm font-medium text-slate-700">النوع</label>
                <select name="type" class="w-full rounded-2xl border border-orange-200 bg-orange-50 px-3 py-2">
                  <option value="Lycée">ليسي</option>
                  <option value="Université">جامعة</option>
                  <option value="Établissement">مؤسسة</option>
                </select>
              </div>
              <div class="space-y-2">
                <label class="text-sm font-medium text-slate-700">المدينة</label>
                <input name="ville" class="w-full rounded-2xl border border-orange-200 bg-orange-50 px-3 py-2" />
              </div>
              <div class="space-y-2">
                <label class="text-sm font-medium text-slate-700">العنوان</label>
                <input name="adresse" class="w-full rounded-2xl border border-orange-200 bg-orange-50 px-3 py-2" />
              </div>
              <div class="space-y-2">
                <label class="text-sm font-medium text-slate-700">الهاتف</label>
                <input name="telephone" class="w-full rounded-2xl border border-orange-200 bg-orange-50 px-3 py-2" />
              </div>
              <div class="space-y-2">
                <label class="text-sm font-medium text-slate-700">البريد الإلكتروني</label>
                <input name="email" type="email" class="w-full rounded-2xl border border-orange-200 bg-orange-50 px-3 py-2" />
              </div>
              <div class="space-y-2 md:col-span-2">
                <label class="text-sm font-medium text-slate-700">الموقع</label>
                <input name="site" class="w-full rounded-2xl border border-orange-200 bg-orange-50 px-3 py-2" />
              </div>
            </form>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="modal-overlay" class="fixed inset-0 hidden items-center justify-center bg-slate-900/70 p-4 backdrop-blur-sm">
    <div class="w-full max-w-xl rounded-3xl border border-orange-200 bg-white shadow-2xl shadow-orange-100/80" role="dialog">
      <div class="flex items-center justify-between border-b border-orange-100 px-5 py-4">
        <h3 id="modal-title" class="text-lg font-semibold text-slate-900">النموذج</h3>
        <button class="btn-icon text-2xl text-slate-400" id="modal-close" aria-label="إغلاق">×</button>
      </div>
      <form id="modal-form" class="space-y-4 px-5 py-4"></form>
      <div class="flex justify-end gap-2 border-t border-orange-100 px-5 py-4">
        <button type="button" class="rounded-2xl border border-orange-200 bg-orange-50 px-4 py-2 text-sm text-slate-700" id="modal-cancel">إلغاء</button>
        <button type="submit" form="modal-form" class="rounded-2xl bg-orange-500 px-4 py-2 text-sm font-semibold text-white" id="modal-submit">حفظ</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
